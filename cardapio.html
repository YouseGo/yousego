<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d" id="meta-theme">
  <title>Cardápio Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0d0d0d; --bg2:#141414; --bg3:#1c1c1c; --card:#181818;
      --brd:rgba(255,255,255,.08); --brd2:rgba(255,255,255,.14);
      --text:#f4f4f4; --text2:#a0a0a0; --text3:#616161;
      --accent:#ff5c35; --accent2:#ffb347;
      --ok:#22c55e; --er:#ef4444;
      --r:14px; --r2:20px;
      --sh:0 4px 24px rgba(0,0,0,.4);
      --font-h:'Syne',sans-serif; --font-b:'DM Sans',sans-serif; --font-m:'DM Mono',monospace;
    }
    html { scroll-behavior:smooth; }
    body { background:var(--bg); color:var(--text); font-family:var(--font-b); font-size:15px; line-height:1.6; min-height:100vh; -webkit-font-smoothing:antialiased; }

    /* ── Header ── */
    .site-header { position:sticky; top:0; z-index:100; background:rgba(13,13,13,.88); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-bottom:1px solid var(--brd); padding:0 20px; }
    .header-inner { max-width:720px; margin:0 auto; height:60px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { font-family:var(--font-h); font-size:1.15rem; font-weight:800; color:var(--text); }
    .brand span { color:var(--accent); }
    .cart-badge-btn { display:flex; align-items:center; gap:7px; background:var(--bg3); border:1px solid var(--brd2); border-radius:999px; padding:6px 14px; cursor:pointer; font-family:var(--font-b); font-size:.8rem; font-weight:600; color:var(--text); transition:all .2s; }
    .cart-badge-btn:hover { border-color:var(--accent); color:var(--accent); }
    .cart-count-bubble { background:var(--accent); color:#fff; border-radius:999px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:.65rem; font-weight:800; font-family:var(--font-m); }

    /* ── Hero ── */
    .store-hero { padding:36px 20px 28px; text-align:center; position:relative; overflow:hidden; border-bottom:1px solid var(--brd); background-size:cover; background-position:center; background-repeat:no-repeat; }
    .store-hero::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 60% 60% at 50% -20%, rgba(255,92,53,.18), transparent); pointer-events:none; }
    .store-hero.has-bg::before { background:linear-gradient(to bottom, rgba(0,0,0,.55) 0%, rgba(0,0,0,.35) 60%, rgba(0,0,0,.7) 100%); }
    .store-hero.has-bg .store-name, .store-hero.has-bg .store-subtitle { color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.5); }
    .store-logo { width:80px; height:80px; border-radius:20px; background:var(--bg3); border:2px solid var(--brd2); display:flex; align-items:center; justify-content:center; font-size:2.2rem; margin:0 auto 14px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,.3); }
    .store-logo img { width:100%; height:100%; object-fit:cover; }
    .store-name { font-family:var(--font-h); font-size:1.7rem; font-weight:800; margin-bottom:6px; letter-spacing:-.5px; }
    .store-subtitle { font-size:.82rem; color:var(--text2); max-width:300px; margin:0 auto; }
    .store-status { display:inline-flex; align-items:center; gap:6px; margin-top:12px; border-radius:999px; padding:4px 14px; font-size:.75rem; font-weight:600; }
    .store-status.open { background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.25); color:var(--ok); }
    .store-status.closed { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.25); color:var(--er); }
    .dot-pulse { width:7px; height:7px; background:var(--ok); border-radius:50%; animation:pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.75)} }

    /* ── Horários ── */
    .horarios-bar { max-width:720px; margin:0 auto; padding:10px 20px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; border-bottom:1px solid var(--brd); }
    .horario-pill { font-size:.7rem; background:var(--bg3); border:1px solid var(--brd2); border-radius:20px; padding:3px 10px; color:var(--text2); }
    .horario-pill.hoje { border-color:var(--accent); color:var(--accent); font-weight:700; }

    /* ── Categorias ── */
    .cat-bar { position:sticky; top:60px; z-index:90; background:rgba(13,13,13,.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--brd); padding:0 20px; }
    .cat-bar-inner { max-width:720px; margin:0 auto; display:flex; gap:6px; overflow-x:auto; padding:10px 0; scrollbar-width:none; }
    .cat-bar-inner::-webkit-scrollbar { display:none; }
    .cat-pill { flex-shrink:0; padding:6px 16px; border-radius:999px; border:1.5px solid var(--brd2); background:transparent; color:var(--text2); font-family:var(--font-b); font-size:.78rem; font-weight:600; cursor:pointer; transition:all .18s; white-space:nowrap; }
    .cat-pill:hover { border-color:var(--accent); color:var(--accent); }
    .cat-pill.active { background:var(--accent); border-color:var(--accent); color:#fff; }

    /* ── Menu ── */
    .menu-area { max-width:720px; margin:0 auto; padding:20px 16px 160px; }
    .section-title { font-family:var(--font-h); font-size:.72rem; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:1.5px; margin:28px 0 14px; padding-bottom:8px; border-bottom:1px solid var(--brd); display:flex; align-items:center; gap:8px; }
    .section-title::before { content:''; display:inline-block; width:3px; height:14px; background:var(--accent); border-radius:2px; }
    .menu-item { display:flex; gap:14px; align-items:flex-start; background:var(--card); border:1px solid var(--brd); border-radius:var(--r2); padding:16px; margin-bottom:10px; transition:all .2s; position:relative; overflow:hidden; cursor:pointer; }
    .menu-item::before { content:''; position:absolute; inset:0; border-radius:var(--r2); border:1.5px solid transparent; transition:border-color .2s; pointer-events:none; }
    .menu-item:hover::before { border-color:rgba(255,92,53,.35); }
    .menu-item.esgotado { opacity:.5; pointer-events:none; }
    .item-photo { width:88px; height:88px; border-radius:12px; overflow:hidden; flex-shrink:0; background:var(--bg3); display:flex; align-items:center; justify-content:center; font-size:2rem; }
    .item-photo img { width:100%; height:100%; object-fit:cover; }
    .item-body { flex:1; min-width:0; }
    .item-name { font-family:var(--font-h); font-size:.92rem; font-weight:700; margin-bottom:4px; line-height:1.3; }
    .item-desc { font-size:.76rem; color:var(--text2); line-height:1.5; margin-bottom:10px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .item-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .item-price { font-family:var(--font-m); font-size:1rem; font-weight:700; color:var(--accent2); }
    .item-badge { font-size:.62rem; background:rgba(255,92,53,.15); color:var(--accent); border:1px solid rgba(255,92,53,.3); border-radius:20px; padding:2px 8px; font-weight:700; }
    .qty-ctrl { display:flex; align-items:center; gap:2px; }
    .qty-btn { width:30px; height:30px; border-radius:8px; border:1.5px solid var(--brd2); background:var(--bg3); color:var(--text); font-size:1rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; line-height:1; }
    .qty-btn:hover { background:var(--accent); border-color:var(--accent); color:#fff; }
    .qty-btn.add { background:var(--accent); border-color:var(--accent); color:#fff; }
    .qty-btn.add:hover { background:#e04a24; }
    .qty-display { min-width:28px; text-align:center; font-family:var(--font-m); font-size:.88rem; font-weight:600; }

    /* ── Float cart ── */
    .float-cart { position:fixed; bottom:0; left:0; right:0; z-index:200; padding:12px 16px; padding-bottom:calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--bg) 60%, transparent); pointer-events:none; transform:translateY(100%); transition:transform .35s cubic-bezier(.34,1.56,.64,1); }
    .float-cart.visible { transform:translateY(0); pointer-events:all; }
    .float-cart-btn { max-width:500px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--accent); color:#fff; border:none; border-radius:var(--r2); padding:15px 20px; font-family:var(--font-b); font-size:.9rem; font-weight:700; cursor:pointer; box-shadow:0 8px 32px rgba(255,92,53,.5); width:100%; transition:all .2s; }
    .float-cart-btn:hover { background:#e04a24; transform:translateY(-2px); }
    .float-cart-count { background:rgba(0,0,0,.25); border-radius:999px; padding:2px 9px; font-size:.75rem; }
    .float-cart-total { font-family:var(--font-m); font-size:.92rem; }

    /* ── Modal ── */
    .modal-bg { display:none; position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.75); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); align-items:flex-end; justify-content:center; padding:0; }
    .modal-bg.open { display:flex; }
    .modal-sheet { background:var(--bg2); border-radius:28px 28px 0 0; border:1px solid var(--brd); border-bottom:none; width:100%; max-width:600px; max-height:92vh; overflow-y:auto; overflow-x:hidden; animation:slideUp .3s cubic-bezier(.34,1.2,.64,1); }
    @keyframes slideUp { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }
    .sheet-handle { width:38px; height:4px; background:var(--brd2); border-radius:2px; margin:14px auto 0; }
    .sheet-header { padding:16px 20px 14px; border-bottom:1px solid var(--brd); display:flex; align-items:center; justify-content:space-between; gap:12px; position:sticky; top:0; background:var(--bg2); z-index:10; }
    .sheet-title { font-family:var(--font-h); font-size:1rem; font-weight:800; }
    .btn-close-modal { width:32px; height:32px; border-radius:999px; border:1.5px solid var(--brd2); background:var(--bg3); color:var(--text2); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1rem; transition:all .15s; }
    .btn-close-modal:hover { border-color:var(--er); color:var(--er); }
    .sheet-body { padding:16px 20px; }

    /* ── Cart items ── */
    .cart-item-row { display:flex; gap:12px; align-items:flex-start; padding:14px 0; border-bottom:1px solid var(--brd); }
    .cart-item-row:last-child { border:none; }
    .cart-item-info { flex:1; min-width:0; }
    .cart-item-name { font-size:.88rem; font-weight:600; margin-bottom:4px; }
    .cart-item-price { font-family:var(--font-m); font-size:.8rem; color:var(--accent2); }
    .cart-item-obs { margin-top:7px; }
    .cart-item-obs input { width:100%; background:var(--bg3); border:1px solid var(--brd2); border-radius:8px; color:var(--text); font-family:var(--font-b); font-size:.74rem; padding:6px 10px; outline:none; transition:border-color .2s; }
    .cart-item-obs input:focus { border-color:var(--accent); }
    .cart-item-obs input::placeholder { color:var(--text3); }
    .cart-qty-ctrl { display:flex; flex-direction:column; align-items:center; gap:4px; }
    .cart-qty-btn { width:28px; height:28px; border-radius:7px; border:1.5px solid var(--brd2); background:var(--bg3); color:var(--text); font-size:.95rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; }
    .cart-qty-btn:hover { background:var(--accent); border-color:var(--accent); color:#fff; }
    .cart-qty-num { font-family:var(--font-m); font-size:.82rem; font-weight:700; }
    .cart-subtotal { display:flex; justify-content:space-between; align-items:center; padding:14px 0 4px; border-top:1px solid var(--brd); margin-top:4px; }
    .cart-subtotal .label { font-size:.82rem; color:var(--text2); }
    .cart-subtotal .value { font-family:var(--font-m); font-size:1.1rem; font-weight:700; color:var(--accent2); }

    /* ── Checkout ── */
    .checkout-divider { font-family:var(--font-h); font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); margin:20px 0 14px; display:flex; align-items:center; gap:8px; }
    .checkout-divider::before, .checkout-divider::after { content:''; flex:1; height:1px; background:var(--brd); }
    .form-group { margin-bottom:12px; }
    .form-label { display:block; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--text3); margin-bottom:6px; }
    .form-input { width:100%; background:var(--bg3); border:1.5px solid var(--brd2); border-radius:10px; color:var(--text); font-family:var(--font-b); font-size:.88rem; padding:10px 14px; outline:none; transition:border-color .2s; -webkit-appearance:none; }
    .form-input:focus { border-color:var(--accent); }
    .form-input::placeholder { color:var(--text3); }
    .form-input.error { border-color:var(--er) !important; }
    .delivery-toggle { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .delivery-opt { display:block; cursor:pointer; }
    .delivery-opt input[type="radio"] { display:none; }
    .delivery-label { display:flex; flex-direction:column; align-items:center; gap:5px; padding:12px; background:var(--bg3); border:1.5px solid var(--brd2); border-radius:12px; text-align:center; font-size:.8rem; font-weight:600; color:var(--text2); transition:all .18s; }
    .delivery-opt input:checked + .delivery-label { border-color:var(--accent); color:var(--accent); background:rgba(255,92,53,.08); }
    .delivery-icon { font-size:1.4rem; }
    .payment-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .pay-opt { display:block; cursor:pointer; }
    .pay-opt input[type="radio"] { display:none; }
    .pay-label { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; background:var(--bg3); border:1.5px solid var(--brd2); border-radius:10px; font-size:.74rem; font-weight:600; color:var(--text2); text-align:center; transition:all .18s; }
    .pay-opt input:checked + .pay-label { border-color:var(--ok); color:var(--ok); background:rgba(34,197,94,.08); }
    .pay-icon { font-size:1.3rem; }
    .btn-enviar { width:100%; background:#25d366; color:#fff; border:none; border-radius:14px; padding:16px; font-family:var(--font-b); font-size:.95rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; margin-top:20px; margin-bottom:8px; transition:all .2s; box-shadow:0 6px 24px rgba(37,211,102,.35); }
    .btn-enviar:hover { background:#1fba58; transform:translateY(-2px); }
    .btn-enviar:active { transform:scale(.98); }
    .btn-enviar svg { width:22px; height:22px; fill:currentColor; }
    .error-msg { display:none; background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); border-radius:10px; padding:10px 14px; font-size:.78rem; color:var(--er); margin-top:10px; }
    .error-msg.show { display:block; }
    .empty-cart { text-align:center; padding:40px 20px; color:var(--text3); }
    .empty-cart .empty-icon { font-size:3rem; margin-bottom:10px; }
    .empty-cart p { font-size:.85rem; }

    /* ── Tema claro ── */
    body.tema-light { --bg:#f8f8f8; --bg2:#fff; --bg3:#f0f0f0; --card:#fff; --brd:rgba(0,0,0,.08); --brd2:rgba(0,0,0,.14); --text:#111; --text2:#555; --text3:#999; }

    /* ── Skeleton ── */
    .skeleton { background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:8px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    .no-wpp-banner { max-width:720px; margin:20px auto; padding:16px 20px; background:rgba(255,92,53,.08); border:1px solid rgba(255,92,53,.25); border-radius:var(--r); font-size:.82rem; color:var(--accent); text-align:center; display:none; }

    /* ── Modal produto (detalhes + tamanhos) ── */
    .prod-modal-bg { display:none; position:fixed; inset:0; z-index:400; background:rgba(0,0,0,.8); backdrop-filter:blur(8px); align-items:flex-end; justify-content:center; }
    .prod-modal-bg.open { display:flex; }
    .prod-modal { background:var(--bg2); border-radius:28px 28px 0 0; border:1px solid var(--brd); border-bottom:none; width:100%; max-width:600px; max-height:88vh; overflow-y:auto; animation:slideUp .3s cubic-bezier(.34,1.2,.64,1); }
    .prod-modal-img { width:100%; height:200px; object-fit:cover; }
    .prod-modal-body { padding:20px; }
    .prod-modal-name { font-family:var(--font-h); font-size:1.2rem; font-weight:800; margin-bottom:6px; }
    .prod-modal-desc { font-size:.84rem; color:var(--text2); line-height:1.6; margin-bottom:14px; }
    .prod-modal-price { font-family:var(--font-m); font-size:1.3rem; font-weight:700; color:var(--accent2); margin-bottom:16px; }
    .tamanhos-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
    .tam-opt { display:block; cursor:pointer; }
    .tam-opt input[type="radio"] { display:none; }
    .tam-label { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:var(--bg3); border:1.5px solid var(--brd2); border-radius:12px; font-size:.84rem; font-weight:600; color:var(--text2); transition:all .18s; }
    .tam-opt input:checked + .tam-label { border-color:var(--accent); color:var(--accent); background:rgba(255,92,53,.08); }
    .obs-field { width:100%; background:var(--bg3); border:1.5px solid var(--brd2); border-radius:10px; color:var(--text); font-family:var(--font-b); font-size:.88rem; padding:10px 14px; outline:none; resize:vertical; min-height:60px; transition:border-color .2s; }
    .obs-field:focus { border-color:var(--accent); }
    .obs-field::placeholder { color:var(--text3); }
    .btn-add-prod { width:100%; background:var(--accent); color:#fff; border:none; border-radius:14px; padding:15px; font-family:var(--font-b); font-size:.95rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; margin-top:16px; transition:all .2s; }
    .btn-add-prod:hover { background:#e04a24; transform:translateY(-1px); }

    @media(max-width:400px) { .item-photo{width:72px;height:72px} .item-name{font-size:.86rem} }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand" id="store-brand"><span>Cardápio</span></div>
      <button class="cart-badge-btn" onclick="abrirCarrinho()" aria-label="Ver carrinho">
        🛒 <div class="cart-count-bubble" id="header-count">0</div>
      </button>
    </div>
  </header>

  <!-- HERO -->
  <section class="store-hero" id="store-hero">
    <div class="store-logo" id="store-logo">🍽️</div>
    <h1 class="store-name" id="store-name">Carregando...</h1>
    <p class="store-subtitle" id="store-subtitle">Peça online e receba em casa</p>
    <div class="store-status open" id="store-status-badge">
      <div class="dot-pulse"></div> Aceitando pedidos
    </div>
  </section>

  <!-- HORÁRIOS -->
  <div id="horarios-wrap" style="display:none">
    <div class="horarios-bar" id="horarios-bar"></div>
  </div>

  <div class="no-wpp-banner" id="no-wpp-banner">⚠️ Número de WhatsApp não configurado. Configure no painel administrativo.</div>

  <!-- CATEGORIAS -->
  <nav class="cat-bar" id="cat-bar">
    <div class="cat-bar-inner" id="cat-pills">
      <div class="cat-pill active skeleton" style="width:80px;height:30px">&nbsp;</div>
    </div>
  </nav>

  <!-- LISTA -->
  <main class="menu-area" id="menu-area">
    <div style="text-align:center;padding:60px 20px;color:var(--text3)">
      <div style="font-size:2rem;margin-bottom:10px">🍳</div>
      <p style="font-size:.85rem">Carregando cardápio...</p>
    </div>
  </main>

  <!-- FLOAT CART -->
  <div class="float-cart" id="float-cart">
    <button class="float-cart-btn" onclick="abrirCarrinho()">
      <div style="display:flex;align-items:center;gap:10px">🛒 <span class="float-cart-count" id="float-count">0 itens</span> Ver Meu Pedido</div>
      <span class="float-cart-total" id="float-total">R$ 0,00</span>
    </button>
  </div>

  <!-- MODAL CARRINHO -->
  <div class="modal-bg" id="modal-carrinho" role="dialog" aria-modal="true">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span class="sheet-title">🛒 Meu Pedido</span>
        <button class="btn-close-modal" onclick="fecharCarrinho()">✕</button>
      </div>
      <div class="sheet-body">
        <div id="cart-items-list"></div>
        <div id="checkout-section" style="display:none">
          <div class="cart-subtotal">
            <span class="label">Subtotal</span>
            <span class="value" id="modal-subtotal">R$ 0,00</span>
          </div>

              </label>
              <label class="delivery-opt">
                <input type="radio" name="tipo-entrega" value="Retirada" id="radio-retirada" onchange="toggleEndereco()">

              <label class="pay-opt"><input type="radio" name="pagamento" value="cartao"><span class="pay-label"><span class="pay-icon">💳</span>Cartão</span></label>
              <label class="pay-opt"><input type="radio" name="pagamento" value="dinheiro"><span class="pay-label"><span class="pay-icon">💵</span>Dinheiro</span></label>

            <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.11 1.526 5.836L0 24l6.343-1.5A11.93 11.93 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.789 9.789 0 01-4.988-1.363l-.357-.213-3.769.892.943-3.682-.234-.378A9.761 9.761 0 012.182 12C2.182 6.57 6.57 2.182 12 2.182S21.818 6.57 21.818 12 17.43 21.818 12 21.818z"/></svg>
            Enviar Pedido pelo WhatsApp
          </button>

  <!-- MODAL PRODUTO DETALHES -->
  <div class="prod-modal-bg" id="prod-modal-bg">
    <div class="prod-modal" id="prod-modal-sheet">
      <div class="sheet-handle"></div>
      <div id="prod-modal-content"></div>
    </div>
  </div>

  <!-- FIREBASE + JS -->
  <script type="module">
  'use strict';
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, collection } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseCfg = {
    apiKey:"AIzaSyB3e2ixEv8G3n8N-eL8dxlrUPRn-VDAA_4",
    authDomain:"sweetoz.firebaseapp.com", projectId:"sweetoz",
    storageBucket:"sweetoz.firebasestorage.app",
    messagingSenderId:"783203069717",
    appId:"1:783203069717:web:ac29de45f322ccd1bfc31c"
  };
  const fbApp = initializeApp(firebaseCfg);
  const db    = getFirestore(fbApp);

  const urlParams  = new URLSearchParams(window.location.search);
  const TENANT     = urlParams.get('tenant') || '';
  const WPP_NUMERO = urlParams.get('whatsapp') || '';

  let CARDAPIO = [], carrinho = [], catAtiva = 'Todos';
  let storeNome = 'Cardápio Digital', storeLogo = '🍽️', storeSub = 'Peça online e receba em casa 🛵';
  let ACCENT = '#ff5c35', TEMA = 'dark', CATS_OCULTAS = [], HORARIOS = null, BGIMG = '';

  const fmtBRL = v => 'R$ ' + (+v||0).toFixed(2).replace('.',',');
  const calcTotal    = () => carrinho.reduce((a,i) => a + i.preco * i.qtd, 0);
  const calcQtdTotal = () => carrinho.reduce((a,i) => a + i.qtd, 0);
  const hoje = () => new Date().toISOString().slice(0,10);
  const uid  = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const DIAS_PT = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  const DIAS_LABEL = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  // ── Carrega dados ────────────────────────────────────────────
  async function carregarDados(){
    if(!TENANT){
      document.getElementById('menu-area').innerHTML = `<div style="text-align:center;padding:60px 20px;color:#ff5c35"><div style="font-size:2rem;margin-bottom:10px">⚠️</div><p>Cardápio não configurado.<br>Acesse pelo link gerado no sistema.</p></div>`;
      return;
    }
    try{
      const [prodSnap, cfgSnap] = await Promise.all([
        getDoc(doc(db,"companies",TENANT,"meta","products")),
        getDoc(doc(db,"companies",TENANT,"meta","config"))
      ]);
      if(prodSnap.exists()){
        CARDAPIO = (prodSnap.data().list||[])
          .filter(p => p.ativo !== false)
          .map(p => ({
            id:       p.id || uid(),
            nome:     p.nome || p.name || 'Produto',
            desc:     p.desc || p.descricao || '',
            preco:    +(p.preco||0),
            cat:      p.cat || 'Geral',
            foto:     p.imgData || p.img || p.emoji || '🍽️',
            tamanhos: p.tamanhos || [],
            esgotado: !!p.esgotado,
          }));
      }
      if(cfgSnap.exists()){
        const cfg = cfgSnap.data();
        storeNome   = cfg.nomeExib || storeNome;
        storeSub    = cfg.sub || (cfg.negocio?.tipo ? cfg.negocio.tipo + ' • Peça online 🛵' : storeSub);
        ACCENT      = cfg.corCardapio || cfg.cor || '#ff5c35';
        TEMA        = cfg.temaCardapio || 'dark';
        CATS_OCULTAS= cfg.catsOcultas || [];
        HORARIOS    = cfg.horarios || null;
        BGIMG       = cfg.cardapioBgImg || '';
        if(cfg.logoImg){
          storeLogo = `<img src="${cfg.logoImg}" alt="Logo">`;
        } else {
          storeLogo = cfg.logo || '🍽️';
        }
        aplicarTema();
      }
    } catch(e){ console.warn("Firebase:", e.message); }

    // Filtra categorias ocultas
    if(CATS_OCULTAS.length) CARDAPIO = CARDAPIO.filter(p => !CATS_OCULTAS.includes(p.cat));

    // Atualiza DOM
    document.getElementById('store-name').textContent       = storeNome;
    document.getElementById('store-brand').innerHTML        = `<span>${storeNome}</span>`;
    document.getElementById('store-logo').innerHTML         = storeLogo;
    document.getElementById('store-subtitle').textContent   = storeSub;
    document.title = `Cardápio — ${storeNome}`;
    if(!WPP_NUMERO) document.getElementById('no-wpp-banner').style.display = 'block';

    renderHorarios();
    renderCatPills();
    renderCardapio();
  }

  // ── Tema e cor ───────────────────────────────────────────────
  function aplicarTema(){
    // Cor de destaque
    document.documentElement.style.setProperty('--accent', ACCENT);
    document.documentElement.style.setProperty('--accent2', ACCENT);
    document.getElementById('meta-theme').content = TEMA==='light'?'#f8f8f8':'#0d0d0d';
    // Tema claro/escuro/marca
    document.body.classList.remove('tema-light','tema-brand');
    if(TEMA==='light') document.body.classList.add('tema-light');
    if(TEMA==='brand'){
      document.documentElement.style.setProperty('--bg', ACCENT+'22');
      document.documentElement.style.setProperty('--bg2', ACCENT+'11');
    }
    // Atualiza hero: imagem de fundo OU gradiente de cor
    const hero = document.getElementById('store-hero');
    if(hero){
      if(BGIMG){
        hero.style.backgroundImage = `url('${BGIMG}')`;
        hero.style.backgroundSize = 'cover';
        hero.style.backgroundPosition = 'center';
        hero.classList.add('has-bg');
        // Remove gradiente de cor quando há imagem
        hero.style.background = '';
        hero.style.backgroundImage = `url('${BGIMG}')`;
      } else {
        hero.style.backgroundImage = '';
        hero.classList.remove('has-bg');
        hero.style.background = `linear-gradient(135deg, ${ACCENT}22 0%, ${ACCENT}11 50%, var(--bg) 100%)`;
      }
    }
  }

  // ── Horários ─────────────────────────────────────────────────
  function renderHorarios(){
    if(!HORARIOS) return;
    const wrap = document.getElementById('horarios-wrap');
    const bar  = document.getElementById('horarios-bar');
    const diaHoje = new Date().getDay(); // 0=dom
    const agora   = new Date().getHours() * 60 + new Date().getMinutes();
    let aberto = false;
    const pills = DIAS_LABEL.map((label, i) => {
      const h = HORARIOS[DIAS_PT[i]];
      if(!h || !h.ativo) return `<div class="horario-pill">${label}: Fechado</div>`;
      const [ah,am] = (h.abre||'00:00').split(':').map(Number);
      const [fh,fm] = (h.fecha||'23:59').split(':').map(Number);
      const abreMin = ah*60+am, fechaMin = fh*60+fm;
      const eHoje = i===diaHoje;
      if(eHoje && agora>=abreMin && agora<=fechaMin) aberto=true;
      return `<div class="horario-pill${eHoje?' hoje':''}">${label}: ${h.abre}–${h.fecha}</div>`;
    }).join('');
    bar.innerHTML = pills;
    wrap.style.display = 'block';
    // Atualiza badge de status
    const badge = document.getElementById('store-status-badge');
    if(!aberto){
      badge.className='store-status closed';
      badge.innerHTML='⛔ Fechado agora';
    }
  }

  // ── Categorias ───────────────────────────────────────────────
  function getCategorias(){ return [...new Set(CARDAPIO.map(i=>i.cat))]; }

  function renderCatPills(){
    const cats = ['Todos', ...getCategorias()];
    document.getElementById('cat-pills').innerHTML = cats.map(c=>
      `<button class="cat-pill${c===catAtiva?' active':''}" onclick="filtrarCat('${c.replace(/'/g,"\\'")}')">${c}</button>`
    ).join('');
  }

  window.filtrarCat = function(cat){
    catAtiva = cat;
    document.querySelectorAll('.cat-pill').forEach(p => p.classList.toggle('active', p.textContent===cat));
    renderCardapio();
    document.getElementById('menu-area').scrollIntoView({behavior:'smooth'});
  };

  // ── Cardápio ─────────────────────────────────────────────────
  function renderCardapio(){
    const area = document.getElementById('menu-area');
    const filtrado = catAtiva==='Todos' ? CARDAPIO : CARDAPIO.filter(p=>p.cat===catAtiva);
    if(!filtrado.length){
      area.innerHTML=`<div style="text-align:center;padding:60px 20px;color:var(--text3)"><div style="font-size:2.5rem;margin-bottom:10px">🍽️</div><p>Nenhum produto disponível.</p></div>`;
      return;
    }
    // Agrupa por categoria
    const grupos = {};
    filtrado.forEach(p => { (grupos[p.cat]||(grupos[p.cat]=[])).push(p); });
    area.innerHTML = Object.entries(grupos).map(([cat, prods])=>`
      <div class="section-title">${cat}</div>
      ${prods.map(p => buildItemCard(p)).join('')}
    `).join('');
    // Listeners de qtd
    area.querySelectorAll('.qty-btn-add').forEach(btn=>{
      btn.addEventListener('click', e=>{e.stopPropagation(); adicionarItem(btn.dataset.id);});
    });
    area.querySelectorAll('.qty-btn-minus').forEach(btn=>{
      btn.addEventListener('click', e=>{e.stopPropagation(); removerItem(btn.dataset.id);});
    });
    // Clique no card abre modal de detalhes
    area.querySelectorAll('.menu-item:not(.esgotado)').forEach(el=>{
      el.addEventListener('click', ()=> abrirProdModal(el.dataset.id));
    });
  }

  function buildItemCard(p){
    const qtd = carrinho.find(i=>i.prodId===p.id)?.qtd || 0;
    const fotoHtml = p.foto && (p.foto.startsWith('http')||p.foto.startsWith('data:'))
      ? `<img src="${p.foto}" alt="${p.nome}" loading="lazy">`
      : p.foto || '🍽️';
    return`<div class="menu-item${p.esgotado?' esgotado':''}" data-id="${p.id}">
      <div class="item-photo">${fotoHtml}</div>
      <div class="item-body">
        <div class="item-name">${p.nome}${p.esgotado?'<span class="item-badge" style="margin-left:6px">Esgotado</span>':''}</div>
        ${p.desc?`<div class="item-desc">${p.desc}</div>`:''}
        <div class="item-footer">
          <div>
            <div class="item-price">${fmtBRL(p.preco)}</div>
            ${p.tamanhos?.length?`<div style="font-size:.65rem;color:var(--text3);margin-top:1px">+${p.tamanhos.length} tamanhos</div>`:''}
          </div>
          <div class="qty-ctrl" onclick="event.stopPropagation()">
            ${qtd>0?`<button class="qty-btn qty-btn-minus" data-id="${p.id}">−</button>
              <span class="qty-display">${qtd}</span>`:'' }
            <button class="qty-btn add qty-btn-add" data-id="${p.id}">+</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  // ── Modal produto ────────────────────────────────────────────
  window.abrirProdModal = function(id){
    const p = CARDAPIO.find(x=>x.id===id); if(!p) return;
    const fotoHtml = p.foto && (p.foto.startsWith('http')||p.foto.startsWith('data:'))
      ? `<img src="${p.foto}" alt="${p.nome}" class="prod-modal-img">`
      : `<div style="height:120px;display:flex;align-items:center;justify-content:center;font-size:4rem;background:var(--bg3)">${p.foto||'🍽️'}</div>`;
    const tamHtml = p.tamanhos?.length ? `
      <div style="margin-bottom:12px">
        <div class="form-label" style="margin-bottom:8px">Tamanho</div>
        <div class="tamanhos-grid">
          ${p.tamanhos.map((t,i)=>`<label class="tam-opt">
            <input type="radio" name="tam-sel" value="${i}" ${i===0?'checked':''}>
            <span class="tam-label"><span>${t.label}</span><span style="font-family:var(--font-m);color:var(--accent2)">${fmtBRL(t.preco)}</span></span>
          </label>`).join('')}
        </div>
      </div>` : '';
    document.getElementById('prod-modal-content').innerHTML = `
      ${fotoHtml}
      <div class="prod-modal-body">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px">
          <div class="prod-modal-name">${p.nome}</div>
          <button class="btn-close-modal" onclick="fecharProdModal()" style="flex-shrink:0">✕</button>
        </div>
        ${p.desc?`<div class="prod-modal-desc">${p.desc}</div>`:''}
        <div class="prod-modal-price">${fmtBRL(p.preco)}</div>
        ${tamHtml}
        <div style="margin-bottom:16px">
          <div class="form-label" style="margin-bottom:8px">Observações <span style="font-weight:400;text-transform:none;letter-spacing:0">(opcional)</span></div>
          <textarea class="obs-field" id="pm-obs" placeholder="Ex: sem cebola, ponto bem passado, molho à parte..."></textarea>
        </div>
        <button class="btn-add-prod" id="btn-pm-add">🛒 Adicionar ao Pedido — ${fmtBRL(p.preco)}</button>
      </div>`;
    document.getElementById('prod-modal-bg').classList.add('open');
    document.getElementById('btn-pm-add').addEventListener('click', ()=>{
      let preco = p.preco, nomeCompleto = p.nome;
      if(p.tamanhos?.length){
        const sel = document.querySelector('input[name="tam-sel"]:checked');
        if(sel){ const t=p.tamanhos[+sel.value]; preco=t.preco; nomeCompleto=p.nome+' ('+t.label+')'; }
      }
      const obs = document.getElementById('pm-obs')?.value.trim()||'';
      adicionarItemCompleto(p.id, nomeCompleto, preco, p.foto, obs);
      fecharProdModal();
    });
    // Atualiza preço ao trocar tamanho
    document.querySelectorAll('input[name="tam-sel"]').forEach(r=>{
      r.addEventListener('change', ()=>{
        const t=p.tamanhos[+r.value];
        const btn=document.getElementById('btn-pm-add');
        if(btn) btn.textContent=`🛒 Adicionar ao Pedido — ${fmtBRL(t.preco)}`;
      });
    });
  };

  window.fecharProdModal = function(){
    document.getElementById('prod-modal-bg').classList.remove('open');
  };
  document.getElementById('prod-modal-bg').addEventListener('click', e=>{
    if(e.target===document.getElementById('prod-modal-bg')) fecharProdModal();
  });

  // ── Carrinho ─────────────────────────────────────────────────
  function adicionarItem(id){
    const p = CARDAPIO.find(x=>x.id===id); if(!p) return;
    if(p.tamanhos?.length){ abrirProdModal(id); return; }
    adicionarItemCompleto(id, p.nome, p.preco, p.foto, '');
  }

  function adicionarItemCompleto(prodId, nome, preco, foto, obs){
    const ex = carrinho.find(i=>i.prodId===prodId && i.nome===nome && i.obs===obs);
    if(ex){ ex.qtd++; } else { carrinho.push({id:uid(), prodId, nome, preco, foto, obs, qtd:1}); }
    sincronizarUI();
    // Pequena animação no botão do carrinho
    const btn=document.querySelector('.cart-badge-btn');
    if(btn){ btn.style.transform='scale(1.15)'; setTimeout(()=>btn.style.transform='',200); }
  }

  function removerItem(prodId){
    const ex = carrinho.find(i=>i.prodId===prodId);
    if(!ex) return;
    if(ex.qtd > 1) ex.qtd--;
    else carrinho = carrinho.filter(i=>i.prodId!==prodId);
    sincronizarUI();
  }

  window.addQtdModal = function(id){ const i=carrinho.find(x=>x.id===id); if(i){i.qtd++;sincronizarUI();renderModalCarrinho();} };
  window.remQtdModal = function(id){ const i=carrinho.find(x=>x.id===id); if(!i)return; if(i.qtd>1){i.qtd--;}else{carrinho=carrinho.filter(x=>x.id!==id);} sincronizarUI();renderModalCarrinho(); };
  window.salvarObs   = function(id,v){ const i=carrinho.find(x=>x.id===id); if(i)i.obs=v; };

  function sincronizarUI(){
    const total = calcTotal(), qtd = calcQtdTotal();
    document.getElementById('header-count').textContent = qtd;
    document.getElementById('float-count').textContent  = qtd+' ite'+(qtd===1?'m':'ns');
    document.getElementById('float-total').textContent  = fmtBRL(total);
    document.getElementById('float-cart').classList.toggle('visible', qtd>0);
    renderCardapio(); // atualiza qtd nos botões
  }

  // ── Modal carrinho ───────────────────────────────────────────
  window.abrirCarrinho = function(){
    document.getElementById('modal-carrinho').classList.add('open');
    renderModalCarrinho();
  };
  window.fecharCarrinho = function(){
    document.getElementById('modal-carrinho').classList.remove('open');
  };
  document.getElementById('modal-carrinho').addEventListener('click', e=>{
    if(e.target===document.getElementById('modal-carrinho')) fecharCarrinho();
  });

  function renderModalCarrinho(){
    const lista    = document.getElementById('cart-items-list');
    const checkout = document.getElementById('checkout-section');
    const subtotal = document.getElementById('modal-subtotal');
    if(!carrinho.length){
      lista.innerHTML=`<div class="empty-cart"><div class="empty-icon">🛒</div><p>Seu carrinho está vazio.</p><p style="margin-top:6px;font-size:.76rem">Adicione produtos para continuar.</p></div>`;
      checkout.style.display='none'; return;
    }
    lista.innerHTML = carrinho.map(item=>{
      const fotoHtml = item.foto&&(item.foto.startsWith('http')||item.foto.startsWith('data:'))
        ? `<img src="${item.foto}" alt="${item.nome}" style="width:48px;height:48px;object-fit:cover;border-radius:8px;flex-shrink:0">`
        : `<span style="font-size:1.6rem;line-height:1">${item.foto||'🍽️'}</span>`;
      return`<div class="cart-item-row" id="cart-row-${item.id}">
        ${fotoHtml}
        <div class="cart-item-info">
          <div class="cart-item-name">${item.nome}</div>
          <div class="cart-item-price">${fmtBRL(item.preco)}/un · Total: <strong>${fmtBRL(item.preco*item.qtd)}</strong></div>
          <div class="cart-item-obs">
            <input type="text" placeholder="✏️ Observação (ex: sem cebola...)" value="${item.obs||''}" oninput="salvarObs('${item.id}',this.value)">
          </div>
        </div>
        <div class="cart-qty-ctrl">
          <button class="cart-qty-btn" onclick="addQtdModal('${item.id}')">+</button>
          <span class="cart-qty-num">${item.qtd}</span>
          <button class="cart-qty-btn" onclick="remQtdModal('${item.id}')">−</button>
        </div>
      </div>`;
    }).join('');
    subtotal.textContent = fmtBRL(calcTotal());
    checkout.style.display = 'block';
  }

  // ── Toggle endereço ──────────────────────────────────────────
  window.toggleEndereco = function(){
    const tipo = document.querySelector('input[name="tipo-entrega"]:checked')?.value;
    document.getElementById('group-endereco').style.display = tipo==='Entrega'?'block':'none';
    document.getElementById('inp-endereco').classList.remove('error');
    document.getElementById('checkout-error').classList.remove('show');
  };

  // ── Validação ────────────────────────────────────────────────
  function validarForm(){
    const nome       = document.getElementById('inp-nome').value.trim();
    const tipoEntr   = document.querySelector('input[name="tipo-entrega"]:checked')?.value;
    const endereco   = document.getElementById('inp-endereco').value.trim();
    const pagamento  = document.querySelector('input[name="pagamento"]:checked')?.value;
    const errDiv     = document.getElementById('checkout-error');
    ['inp-nome','inp-endereco'].forEach(id=>document.getElementById(id).classList.remove('error'));
    errDiv.classList.remove('show');
    const erros = [];
    if(!nome)    { document.getElementById('inp-nome').classList.add('error'); erros.push('nome'); }
    if(!tipoEntr) erros.push('tipo de entrega');
    if(tipoEntr==='Entrega'&&!endereco){ document.getElementById('inp-endereco').classList.add('error'); erros.push('endereço'); }
    if(!pagamento) erros.push('forma de pagamento');
    if(erros.length){ errDiv.textContent=`⚠️ Preencha: ${erros.join(', ')}.`; errDiv.classList.add('show'); errDiv.scrollIntoView({behavior:'smooth',block:'center'}); }
    return erros.length===0;
  }

  // ── ENVIO — Firebase + WhatsApp ──────────────────────────────
  document.getElementById('btn-enviar-pedido').addEventListener('click', async function(){
    if(!WPP_NUMERO){ alert('⚠️ Número de WhatsApp não configurado para esta loja.'); return; }
    if(!validarForm()) return;
    const btn = this; btn.disabled=true; btn.textContent='⏳ Enviando...';

    const nomeCliente = document.getElementById('inp-nome').value.trim();
    const foneCliente = document.getElementById('inp-fone').value.trim();
    const tipoEntrega = document.querySelector('input[name="tipo-entrega"]:checked').value;
    const endereco    = tipoEntrega==='Entrega' ? document.getElementById('inp-endereco').value.trim() : 'Retirada no local';
    const pagamento   = document.querySelector('input[name="pagamento"]:checked').value;
    const total       = calcTotal();
    const pedidoId    = uid();
    const tsAgora     = Date.now();

    // ── 1. Firebase — usa setDoc com ID fixo (sem serverTimestamp) ──
    // SOLUÇÃO DO BUG: serverTimestamp() era null no primeiro snapshot,
    // causando o pedido ser ignorado pelo listener do sistema.
    // Agora usamos Date.now() como número inteiro — sempre disponível.
    if(TENANT){
      try{
        const pedidoFb = {
          id:        pedidoId,
          cliente:   nomeCliente,
          fone:      foneCliente || '',
          modo:      tipoEntrega==='Entrega' ? 'delivery' : 'balcao',
          endereco:  endereco,
          pagamento: pagamento,
          itens:     carrinho.map(i=>({id:i.id, nome:i.nome, preco:i.preco, qtd:i.qtd, obs:i.obs||''})),
          total:     total,
          val:       total,
          status:    'pendente',
          kdsStatus: 'pendente',
          origem:    'cardapio-digital',
          data:      hoje(),
          obs:       carrinho.filter(i=>i.obs).map(i=>`${i.nome}: ${i.obs}`).join(' | '),
          criadoEm:  tsAgora,   // número inteiro — sem serverTimestamp
          _at:       tsAgora,
        };
        // setDoc com ID fixo — garante idempotência e sem índice composto necessário
        await setDoc(
          doc(db, "companies", TENANT, "kds_pedidos", pedidoId),
          pedidoFb
        );
        console.log('✅ Pedido gravado no Firebase:', pedidoId);
      } catch(e){
        console.warn("Firestore gravação falhou:", e.message);
        // Não bloqueia — WhatsApp ainda vai
      }
    }

    // ── 2. Mensagem WhatsApp ─────────────────────────────────────
    let msg = '';
    msg += '*\uD83D\uDED2 NOVO PEDIDO \u2014 CARD\u00C1PIO DIGITAL*\n';
    msg += '\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n';
    msg += `*\uD83D\uDC64 Cliente:* ${nomeCliente}\n`;
    if(foneCliente) msg += `*\uD83D\uDCF1 Contato:* ${foneCliente}\n`;
    msg += `*\uD83D\uDCE6 Entrega:* ${tipoEntrega}\n`;
    if(tipoEntrega==='Entrega') msg += `*\uD83D\uDCCD Endere\u00E7o:* ${endereco}\n`;
    msg += `*\uD83D\uDCB3 Pagamento:* ${pagamento.toUpperCase()}\n`;
    msg += '\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n';
    msg += '*\uD83D\uDCCB ITENS DO PEDIDO:*\n\n';
    carrinho.forEach((item, idx)=>{
      const sub = item.preco * item.qtd;
      msg += `*${idx+1}. ${item.nome}*\n`;
      msg += `   Qtd: ${item.qtd}x \u2014 ${fmtBRL(item.preco)}/un\n`;
      msg += `   Subtotal: *${fmtBRL(sub)}*\n`;
      if(item.obs) msg += `   \u270F\uFE0F Obs: _${item.obs}_\n`;
      msg += '\n';
    });
    msg += '\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n';
    msg += `\uD83D\uDCB0 *TOTAL: ${fmtBRL(total)}*\n`;
    msg += '\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n';
    msg += `_Pedido #${pedidoId.slice(-6).toUpperCase()} \u2014 via Card\u00E1pio Digital YOUSEGO_ \uD83C\uDF7D\uFE0F`;

    let numero = WPP_NUMERO.replace(/\D/g,'');
    if(!numero.startsWith('55')) numero = '55' + numero;
    window.open(`https://wa.me/${numero}?text=${encodeURIComponent(msg)}`, '_blank');

    // ── 3. Limpa ──────────────────────────────────────────────────
    carrinho = [];
    fecharCarrinho();
    sincronizarUI();
    ['inp-nome','inp-fone','inp-endereco'].forEach(id=>{ document.getElementById(id).value=''; });
    document.querySelectorAll('input[name="tipo-entrega"]').forEach(r=>r.checked=false);
    document.querySelectorAll('input[name="pagamento"]').forEach(r=>r.checked=false);
    document.getElementById('group-endereco').style.display='none';
    btn.disabled=false;
    btn.innerHTML=`<svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.11 1.526 5.836L0 24l6.343-1.5A11.93 11.93 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.789 9.789 0 01-4.988-1.363l-.357-.213-3.769.892.943-3.682-.234-.378A9.761 9.761 0 012.182 12C2.182 6.57 6.57 2.182 12 2.182S21.818 6.57 21.818 12 17.43 21.818 12 21.818z"/></svg>
    Enviar Pedido pelo WhatsApp`;
  });

  // ── Init ─────────────────────────────────────────────────────
  carregarDados();
  </script>
